<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif;
           font-size: 12px; background: #1e1e1e; color: #d4d4d4; height: 100vh;
           display: flex; flex-direction: column; }

    .toolbar { display: flex; align-items: center; gap: 10px;
               padding: 8px 12px; border-bottom: 1px solid #3e3e3e;
               background: #252526; flex-shrink: 0; }
    .toolbar h1 { font-size: 13px; font-weight: 600; color: #4fc3f7; }
    .toolbar button { font-size: 11px; padding: 3px 10px; border-radius: 4px;
                      border: 1px solid #555; background: #333; color: #ccc;
                      cursor: pointer; }
    .toolbar button:hover { background: #444; }
    .counter { font-size: 11px; color: #888; margin-left: auto; }

    #log { flex: 1; overflow-y: auto; }

    .entry { border-bottom: 1px solid #2a2a2a; padding: 10px 14px; cursor: pointer;
             transition: background 0.1s; }
    .entry:hover { background: #2a2a2a; }
    .entry.drift { border-left: 3px solid #f44747; }
    .entry.clean { border-left: 3px solid #4ec9b0; }

    .entry-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .method { font-size: 10px; font-weight: 700; padding: 1px 6px;
              border-radius: 3px; background: #0d7acc; color: #fff; }
    .url { font-family: monospace; font-size: 11px; color: #9cdcfe; flex: 1;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .latency { font-size: 10px; color: #888; }
    .drift-badge { font-size: 10px; font-weight: 700; color: #f44747;
                   background: rgba(244,71,71,0.12); padding: 1px 6px;
                   border-radius: 3px; }
    .ok-badge { font-size: 10px; font-weight: 700; color: #4ec9b0;
                background: rgba(78,201,176,0.12); padding: 1px 6px;
                border-radius: 3px; }

    .drift-detail { display: none; padding: 10px 12px; background: #1a1a1a;
                    border-top: 1px solid #333; }
    .drift-detail.open { display: block; }
    .diff-row { display: grid; grid-template-columns: 1fr 1fr 1fr;
                gap: 8px; padding: 6px 0; border-bottom: 1px solid #2a2a2a;
                font-size: 11px; }
    .diff-row:last-child { border-bottom: none; }
    .diff-field { color: #ce9178; font-family: monospace; }
    .diff-api { color: #4ec9b0; }
    .diff-ui { color: #f44747; }
    .diff-header { font-size: 10px; font-weight: 700; color: #888;
                   text-transform: uppercase; letter-spacing: 0.05em;
                   padding-bottom: 6px; border-bottom: 1px solid #333; margin-bottom: 4px;
                   display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    #notice { padding: 8px 14px; background: #4d3b00; color: #ffd166; font-size: 11px; flex-shrink: 0; }
    .empty { padding: 40px; text-align: center; color: #555; }
    .empty p { margin-bottom: 8px; }
    .ts { font-size: 10px; color: #666; }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>⚡ Driftwatch</h1>
    <button id="clear">Clear</button>
    <span class="counter" id="counter">0 calls · 0 drifts</span>
  </div>
  <div id="notice" hidden>Driftwatch is not active on this page yet. Reload the page to start capturing.</div>
  <div id="log">
    <div class="empty" id="empty">
      <p>Waiting for API calls…</p>
      <p style="font-size:10px">Navigate or interact with any page to see results.</p>
    </div>
  </div>
  <script src="panel.js"></script>
</body></html>
